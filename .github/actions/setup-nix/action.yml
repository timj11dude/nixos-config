name: Set up Nix
description: Install Nix with GitHub authentication for pinned tarball fetches.

inputs:
  github-token:
    description: GitHub token used to authenticate Nix fetches against github.com.
    required: true

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      with:
        github_access_token: ${{ inputs.github-token }}
