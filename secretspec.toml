#:schema https://secretspec.dev/schema/secretspec.schema.json

[project]
name = "nixos-config"
revision = "1.0"

[profiles.default]
GPG_PRIVATE_KEY = { description = "ASCII-armored GPG private key for git commit signing (5CCFF11F4D012DE2) and SSH auth", required = true }
GPG_OWNERTRUST = { description = "GPG ownertrust export (from gpg --export-ownertrust) for trusting the signing key", required = false }
SOPS_AGE_KEY = { description = "Age private key for sops-nix decryption (~/.config/sops/age/keys.txt)", required = true }
RESTIC_PASSWORD = { description = "Repository password for restic backups (~/.config/restic/password)", required = true }

[profiles.gpg]
GPG_PRIVATE_KEY = { description = "ASCII-armored GPG private key for git commit signing (5CCFF11F4D012DE2) and SSH auth", required = true }
GPG_OWNERTRUST = { description = "GPG ownertrust export (from gpg --export-ownertrust) for trusting the signing key", required = false }
